
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Craft Shop</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 16px;
    background: #e8dfd2;
    font-family: Arial, sans-serif;
    color: #654733;
    min-height: 100vh;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 40px 24px;
    background: #fffaf3;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 8px 30px #00000012;
}

.logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    background: #eadbc7;
}

h1 {
    font-family: Georgia, serif;
    font-size: 28px;
    margin-bottom: 10px;
}

p {
    font-size: 14px;
    line-height: 1.6;
    color: #856044;
}

.links {
    margin-top: 30px;
}

.link {
    display: block;
    padding: 18px;
    margin: 14px 0;
    background: #795c43;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 15px;
    transition: 0.25s;
}

.link:hover {
    background: #98775a;
    transform: translateY(-3px);
}

footer {
    margin-top: 40px;
    font-size: 12px;
    color: #856044;
}
</style>
</head>

<body>

<main class="container">

    <img class="logo" src="logo.jpg"
         alt="Shop Logo">

    <h1>Your Craft Shop</h1>

    <p>
        Handmade with love ♡<br>
        Beautiful crafts for your special moments.
    </p>

    <div class="links">

        <a class="link"
        href="https://wa.me/8801XXXXXXXXX">
        Order on WhatsApp
        </a>

        <a class="link"
        href="https://facebook.com/USERNAME">
        Facebook
        </a>

        <a class="link"
        href="https://instagram.com/USERNAME">
        Instagram
        </a>

        <a class="link"
        href="https://tiktok.com/@USERNAME">
        TikTok
        </a>

        <a class="link"
        href="mailto:you@example.com">
        Contact Us
        </a>

    </div>

    <footer>
        Made with love • Since 2026
    </footer>

</main>

</body>
</html>
